name: Refresh AWS pricing data

# AWS changes prices without notice. Re-read the live feeds weekly and commit any
# movement; the Pages workflow then redeploys automatically on that push.
on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-pricing
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild dataset from AWS feeds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild pricing dataset
        run: python3 tools/build_pricing.py

      - name: Sanity-check the result
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('assets/data/pricing.json'))
          assert len(d['regions']) >= 20, f"only {len(d['regions'])} regions"
          for reg in d['regions']:
              assert reg['instances'], f"{reg['id']} has no instances"
              rates = reg['rates']
              for key in ('ipv4_in_use_hr', 'ebs_gp3_gb_mo', 'nat_hr', 'dto_gb'):
                  assert rates.get(key), f"{reg['id']} missing {key}"
          print(f"ok: {len(d['regions'])} regions, "
                f"{sum(len(r['instances']) for r in d['regions'])} rate rows")
          PY

      # A plain `git diff` cannot answer "did a price move?", because every
      # generated file carries a fresh build timestamp and would therefore
      # differ on every single run. Compare content fingerprints with the
      # build-time-only fields stripped out instead.
      - name: Detect real rate movement
        id: check
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess

          BUILD_TIME_ONLY = ("generated_utc", "generated_human")
          TRACKED = (
              "assets/data/pricing.json",
              "_data/rates.json",
              "_data/regions.json",
              "_data/meta.json",
          )

          def fingerprint(text):
              data = json.loads(text)
              if isinstance(data, dict):
                  for key in BUILD_TIME_ONLY:
                      data.pop(key, None)
                  # AWS republishes feeds without changing prices, so the
                  # publication dates are not evidence of a rate change either.
                  data.pop("feed_publication_dates", None)
              return hashlib.sha256(
                  json.dumps(data, sort_keys=True, separators=(",", ":")).encode()
              ).hexdigest()

          changed = []
          for path in TRACKED:
              head = subprocess.run(["git", "show", f"HEAD:{path}"],
                                    capture_output=True, text=True)
              if head.returncode != 0:
                  print(f"NEW       {path}")
                  changed.append(path)
                  continue
              with open(path, encoding="utf-8") as fh:
                  current = fh.read()
              if fingerprint(head.stdout) != fingerprint(current):
                  print(f"CHANGED   {path}")
                  changed.append(path)
              else:
                  print(f"unchanged {path}")

          print("\nreal movement:", bool(changed))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"changed={'true' if changed else 'false'}\n")
          PY

      - name: Commit the refreshed data
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/pricing.json \
                  _data/rates.json _data/regions.json _data/meta.json
          git commit -m "chore(data): refresh AWS pricing from live feeds"
          git push

      - name: Discard build-timestamp churn
        if: steps.check.outputs.changed != 'true'
        run: |
          git checkout -- .
          echo "No rate movement this run. Nothing committed, no redeploy triggered."
